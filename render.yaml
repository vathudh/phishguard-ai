services:
  - type: web
    name: phishguard-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: ./start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PHISHGUARD_DATA_DIR
        value: /var/data
    disk:
      name: phishguard-data
      mountPath: /var/data
      sizeGB: 1
